name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Audit dependencies (fails on high severity)
        run: npm audit --audit-level=high

      - name: Check JS syntax
        run: |
          for f in $(find src/javascript -name '*.js'); do
            node --check "$f"
          done

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions
        run: npm run check:edge

      - name: Run unit and screen tests (fails below the coverage floor)
        run: npm run test:coverage

      - name: Run PWA audit (manifest, icons, service worker)
        run: npm run test:pwa

  rls-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:17.6.1.111
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: "Auth stubs (a imagem crua não tem o GoTrue: auth.jwt(), auth.uid(...))"
        run: psql "postgresql://supabase_admin:postgres@localhost:54322/postgres" -f test-support/local-test-db-auth-stubs.sql

      - name: Load schema (storage.* errors are expected - that service isn't provisioned here)
        run: psql "postgresql://postgres:postgres@localhost:54322/postgres" -f supabase/schema.sql

      - name: Grant table access to anon/authenticated (mirrors hosted project's API auto-expose)
        run: psql "postgresql://postgres:postgres@localhost:54322/postgres" -f test-support/local-test-db-grants.sql

      - name: Unschedule pg_cron jobs (dispatch-deferred-pushes etc. would run mid-test during business hours)
        run: psql "postgresql://postgres:postgres@localhost:54322/postgres" -v ON_ERROR_STOP=1 -c "SELECT cron.unschedule(jobid) FROM cron.job;"

      - name: Run RLS integration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres
        run: npm run test:integration

      - name: Postgres server log on failure
        if: failure()
        run: docker logs --tail 300 "${{ job.services.postgres.id }}"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Hide migrations (they assume employees/etc. already exist, as on the hosted project; schema.sql is the fresh-DB bootstrap loaded below)
        run: mv supabase/migrations "$RUNNER_TEMP/supabase-migrations"

      - name: Start local Supabase (db + auth + rest + storage; documentos, rescisão e selfies do ponto gravam no Storage real)
        run: supabase start --exclude logflare,studio,realtime,imgproxy,vector,edge-runtime

      - name: Load schema
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/schema.sql

      - name: Grant table access to anon/authenticated (mirrors hosted project's API auto-expose)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f test-support/local-test-db-grants.sql

      - name: Unschedule pg_cron jobs (dispatch-deferred-pushes etc. would run mid-test during business hours)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -c "SELECT cron.unschedule(jobid) FROM cron.job;"

      - name: Restore migrations directory
        run: mv "$RUNNER_TEMP/supabase-migrations" supabase/migrations

      - name: Expose local service key (the E2E cleanup removes test files through the Storage API)
        run: echo "E2E_SUPABASE_SERVICE_KEY=$(supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p')" >> "$GITHUB_ENV"

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Load test (20 colaboradores + 3 RH simultâneos; falha com erro ou p95 acima do limite)
        run: npm run test:load

      - name: Postgres server log on failure
        if: failure()
        run: docker logs --tail 300 supabase_db_nexus-rh

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Serve the site as Vercel does (vercel.json headers, .vercelignore paths hidden)
        run: |
          COMO_PRODUCAO=1 E2E_STATIC_PORT=4180 node test-support/static-server.js &
          sleep 2

      - name: OWASP ZAP baseline (spider + passive scan; fails on FAIL-level findings)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable             zap-baseline.py -t http://127.0.0.1:4180/src/screens/login.html -m 2 -J zap.json -r zap.html -I

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap/
