name: Exercício de restauração

on:
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch:

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore drill (pg_dump -> gpg AES-256 -> pg_restore em banco novo)
        run: node scripts/backup/restore-drill.mjs

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-report
          path: docs/operacao/evidencias/restore-drill-*
          retention-days: 90