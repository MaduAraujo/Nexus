<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../javascript/theme.js"></script>
    <title>Comunicados</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../styles/btn-back.css">
    <link rel="stylesheet" href="../styles/comunicados-colaborador.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <a href="../screens/inicio-colaborador.html" class="btn-back" aria-label="Voltar">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            </a>
        </div>
        <div class="topbar-right">
            <span class="unread-badge hidden" id="unread-badge">
                <i class="fas fa-bell"></i>
                <span id="unread-count">0</span> não lido(s)
            </span>
        </div>
    </header>

        <main class="content">
            <div class="page-body">

                <div class="stats-row">
                    <div class="stat-card stat-card--blue">
                        <div class="stat-icon"><i class="fas fa-bullhorn"></i></div>
                        <div class="stat-info">
                            <span class="stat-label">Total de comunicados</span>
                            <span class="stat-value" id="stat-total">0</span>
                        </div>
                    </div>
                    <div class="stat-card stat-card--purple">
                        <div class="stat-icon"><i class="fas fa-globe"></i></div>
                        <div class="stat-info">
                            <span class="stat-label">Para todos</span>
                            <span class="stat-value" id="stat-todos">0</span>
                        </div>
                    </div>
                    <div class="stat-card stat-card--teal">
                        <div class="stat-icon"><i class="fas fa-building"></i></div>
                        <div class="stat-info">
                            <span class="stat-label">Para o seu departamento</span>
                            <span class="stat-value" id="stat-dept">0</span>
                        </div>
                    </div>
                </div>

                <div class="toolbar">
                    <div class="search-wrapper">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="search-input" placeholder="Buscar comunicado…">
                        <button class="search-clear hidden" id="search-clear">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="filter-tabs">
                        <button class="filter-btn active" data-filter="todos-vis">Todos</button>
                        <button class="filter-btn" data-filter="nao-lidos">Não lidos</button>
                    </div>
                    <button class="btn-marcar-todos hidden" id="btn-marcar-todos">
                        <i class="fas fa-check-double"></i>
                        <span>Marcar todos como lido</span>
                    </button>
                </div>

                <div id="comunicados-list"></div>

            </div>
        </main>

<!-- Modal de leitura -->
<div id="msg-modal" class="msg-modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="msg-modal-card">
        <div class="msg-modal-header">
            <div class="msg-modal-badges">
                <span class="badge-cat" id="modal-cat"></span>
                <span class="comunicado-dest" id="modal-dest"></span>
            </div>
            <button class="msg-modal-close" id="modal-close" aria-label="Fechar">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="msg-modal-date" id="modal-date"></div>
        <div class="msg-modal-body" id="modal-body"></div>
    </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../javascript/supabase-client.js"></script>
<script src="../javascript/auth.js"></script>
<script src="../javascript/comunicado-format.js"></script>
<script src="../javascript/comunicados-colaborador.js"></script>
</body>
</html>
