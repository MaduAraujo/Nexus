<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus — Comunicação Interna</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../styles/comunicação.css">
    <link rel="stylesheet" href="../styles/btn-back.css">
</head>
<body>
    <div class="layout">
        <div class="main-wrapper" style="margin-left:0;width:100%">
            <header class="topbar">
                <div class="topbar-left">
                    <a href="../screens/inicio-rh.html" class="btn-back">
                        <i class="fas fa-arrow-left"></i>
                        <span>Voltar</span>
                    </a>
                </div>
                <div class="header-actions">
                    <button id="main-toggle-btn" class="btn-upload" data-current="writing">
                        <i class="fas fa-history"></i>
                        <span>Comunicados Enviados</span>
                    </button>
                </div>
            </header>

            <button class="btn-fab" id="btn-fab" aria-label="Comunicados Enviados">
                <i class="fas fa-history"></i>
            </button>

            <main class="content">
                <div class="page-body">
                    <div id="write-section">
                        <div class="stats-row">
                            <div class="stat-card stat-card--enviados">
                                <div class="stat-icon-wrap">
                                    <i class="fas fa-paper-plane"></i>
                                </div>
                                <div class="stat-body">
                                    <span class="stat-value" id="stat-total">—</span>
                                    <span class="stat-label">Enviados</span>
                                </div>
                            </div>
                            <div class="stat-card stat-card--leituras">
                                <div class="stat-icon-wrap">
                                    <i class="fas fa-eye"></i>
                                </div>
                                <div class="stat-body">
                                    <span class="stat-value" id="stat-reads">—</span>
                                    <span class="stat-label">Leituras</span>
                                </div>
                            </div>
                            <div class="stat-card stat-card--semLeitura">
                                <div class="stat-icon-wrap">
                                    <i class="fas fa-bell"></i>
                                </div>
                                <div class="stat-body">
                                    <span class="stat-value" id="stat-unread">—</span>
                                    <span class="stat-label">Sem leitura</span>
                                </div>
                            </div>
                        </div>

                        <div class="content-card">
                            <div class="compose-header">
                                <div class="compose-icon-wrap">
                                    <i class="fas fa-pen-to-square"></i>
                                </div>
                                <div>
                                    <h3 class="compose-title">Novo Comunicado</h3>
                                    <p class="compose-sub">Selecione o destino e escreva sua mensagem</p>
                                </div>
                            </div>
                            <div class="message-form">
                                <div class="dest-inline-section">
                                    <label class="input-label">Destino</label>
                                    <div class="dest-inline-grid" id="dest-inline-grid">
                                        <button class="dest-inline-chip" data-dest="Todos" type="button">
                                            <i class="fas fa-globe"></i><span>Todos</span>
                                        </button>
                                        <button class="dest-inline-chip" data-dest="TI" type="button">
                                            <i class="fas fa-code"></i><span>TI</span>
                                        </button>
                                        <button class="dest-inline-chip" data-dest="RH" type="button">
                                            <i class="fas fa-user-tie"></i><span>RH</span>
                                        </button>
                                        <button class="dest-inline-chip" data-dest="Financeiro" type="button">
                                            <i class="fas fa-dollar-sign"></i><span>Financeiro</span>
                                        </button>
                                        <button class="dest-inline-chip" data-dest="Marketing" type="button">
                                            <i class="fas fa-ad"></i><span>Marketing</span>
                                        </button>
                                        <button class="dest-inline-chip" data-dest="Jurídico" type="button">
                                            <i class="fas fa-gavel"></i><span>Jurídico</span>
                                        </button>
                                        <button class="dest-inline-chip" data-dest="Administrativo" type="button">
                                            <i class="fas fa-building"></i><span>Administrativo</span>
                                        </button>
                                    </div>
                                </div>

                                <div class="message-area-section">
                                    <label class="input-label" for="message-text">Mensagem</label>
                                    <textarea id="message-text" class="message-input"
                                        placeholder="Digite seu comunicado aqui..."></textarea>
                                    <div class="form-footer">
                                        <span class="char-count" id="char-count">0 caracteres</span>
                                        <button class="send-button" id="send-btn" type="button" disabled>
                                            <i class="fas fa-paper-plane"></i> Enviar Comunicado
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="sent-messages-section" style="display: none;">
                        <div class="content-card">
                            <div class="content-card-toolbar">
                                <div class="history-filters">
                                    <button class="hist-chip hist-chip--active" data-dest="todos"
                                        onclick="setHistFilter(this)">Todos</button>
                                    <button class="hist-chip" data-dest="Todos" onclick="setHistFilter(this)">Para
                                        Todos</button>
                                    <button class="hist-chip" data-dest="TI" onclick="setHistFilter(this)">TI</button>
                                    <button class="hist-chip" data-dest="RH" onclick="setHistFilter(this)">RH</button>
                                    <button class="hist-chip" data-dest="Financeiro"
                                        onclick="setHistFilter(this)">Financeiro</button>
                                    <button class="hist-chip" data-dest="Marketing"
                                        onclick="setHistFilter(this)">Marketing</button>
                                    <button class="hist-chip" data-dest="Jurídico"
                                        onclick="setHistFilter(this)">Jurídico</button>
                                    <button class="hist-chip" data-dest="Administrativo"
                                        onclick="setHistFilter(this)">Administrativo</button>
                                </div>
                                <div class="search-wrapper">
                                    <i class="fas fa-magnifying-glass search-icon"></i>
                                    <input type="text" id="search-input" placeholder="Buscar comunicado...">
                                    <button class="search-clear hidden" id="search-clear">
                                        <i class="fas fa-xmark"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="table-container">
                                <table class="messages-table">
                                    <thead>
                                        <tr>
                                            <th>Data</th>
                                            <th>Mensagem</th>
                                            <th>Destino</th>
                                            <th>Leituras</th>
                                            <th>Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody id="messages-list"></tbody>
                                </table>
                            </div>
                            <div class="messages-cards" id="messages-cards"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../javascript/supabase-client.js"></script>
    <script src="../javascript/comunicação.js"></script>
</body>
</html>
