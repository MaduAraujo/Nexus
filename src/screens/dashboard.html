<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus — Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../styles/dashboard.css" />
    <style>
        .main-wrapper { margin-left: 0 !important; width: 100% !important; }
        .btn-back { display: inline-flex; align-items: center; gap: 8px; color: #9ca3af; text-decoration: none; font-size: 0.85rem; font-weight: 600; padding: 6px 10px; border-radius: 8px; transition: color 0.2s, background 0.2s; }
        .btn-back:hover { color: #fff; background: rgba(255,255,255,0.08); }
        .btn-back i { font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="layout">
        <div class="main-wrapper" style="margin-left:0;width:100%">
            <header class="topbar">
                <div class="topbar-left">
                    <a href="../screens/inicio-rh.html" class="btn-back">
                        <i class="fas fa-arrow-left"></i>
                        <span>Voltar</span>
                    </a>
                </div>
                <div class="topbar-right">
                    <div class="export-dropdown" id="export-dropdown">
                        <button class="btn-export" id="btn-export">
                            <i class="fas fa-arrow-up-from-bracket"></i>
                            <span>Exportar</span>
                            <i class="fas fa-chevron-down export-chevron"></i>
                        </button>
                        <div class="export-menu" id="export-menu">
                            <p class="export-menu-label">Formato de exportação</p>
                            <button class="export-option" id="export-excel">
                                <div class="export-option-icon export-option-icon--excel">
                                    <i class="fas fa-table"></i>
                                </div>
                                <div class="export-option-body">
                                    <span class="export-option-title">Excel</span>
                                    <span class="export-option-sub">.xlsx — Planilha editável</span>
                                </div>
                            </button>
                            <button class="export-option" id="export-pdf">
                                <div class="export-option-icon export-option-icon--pdf">
                                    <i class="fas fa-file-lines"></i>
                                </div>
                                <div class="export-option-body">
                                    <span class="export-option-title">PDF</span>
                                    <span class="export-option-sub">.pdf — Documento imprimível</span>
                                </div>
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <main class="content">
                <section class="cards">
                    <div class="card">
                        <div class="card-icon active-icon"><i class="fas fa-user-check"></i></div>
                        <div class="card-info">
                            <p class="card-label">Ativos</p>
                            <h2 id="count-ativos">0</h2>
                            <span class="card-delta" id="delta-ativos"></span>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-icon holiday-icon"><i class="fas fa-umbrella-beach"></i></div>
                        <div class="card-info">
                            <p class="card-label">Em Férias</p>
                            <h2 id="count-ferias">0</h2>
                            <span class="card-delta" id="delta-ferias"></span>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-icon inactive-icon"><i class="fas fa-user-times"></i></div>
                        <div class="card-info">
                            <p class="card-label">Inativos</p>
                            <h2 id="count-inativos">0</h2>
                            <span class="card-delta" id="delta-inativos"></span>
                        </div>
                    </div>
                </section>

                <section class="metrics-extra">
                    <div class="metric-pill metric-pill--turnover">
                        <i class="fas fa-arrows-rotate"></i>
                        <span>Turnover 12 meses: <strong id="turnover-rate">—</strong></span>
                    </div>
                    <div class="metric-pill metric-pill--absent">
                        <i class="fas fa-calendar-xmark"></i>
                        <span>Absenteísmo este mês: <strong id="absenteeism-rate">—</strong></span>
                    </div>
                </section>


                <section class="charts-grid">
                    <div class="card chart-card">
                        <div class="card-header">
                            <h3><i class="fas fa-exchange-alt"></i> Admissões vs Desligamentos</h3>
                        </div>
                        <div class="chart-container">
                            <canvas id="chart-turnover"></canvas>
                        </div>
                    </div>

                    <div class="card chart-card">
                        <div class="card-header">
                            <h3><i class="fas fa-file-contract"></i> Tipo de Contrato</h3>
                        </div>
                        <div class="chart-container">
                            <canvas id="chart-contracts"></canvas>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header">
                            <h3><i class="fas fa-chart-bar"></i> Headcount por Departamento</h3>
                        </div>
                        <div id="department-list" class="department-grid"></div>
                    </div>
                </section>
            </main>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../javascript/supabase-client.js"></script>
    <script src="../javascript/dashboard.js"></script>
</body>
</html>
