<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0a0d" />
    <link rel="icon" href="/src/assets/icons/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/src/assets/icons/apple-touch-icon.png" />
    <script src="/src/javascript/shared/pwa-register.js"></script>
    <script src="../javascript/shared/theme.js"></script>
    <title>Painel</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../styles/inicio-colaborador.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-name">Ne<span class="x">x</span>us</div>
            <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Colapsar menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        <nav class="sidebar-nav">
            <ul class="nav-list">
                <li class="nav-item active">
                    <a href="../screens/inicio-colaborador.html" class="nav-link active">
                        <span class="nav-icon"><i class="fas fa-home"></i></span>
                        <span class="nav-text">Painel</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../screens/chat-colaborador.html" class="nav-link">
                        <span class="nav-icon"><i class="fas fa-comments"></i></span>
                        <span class="nav-text">Chat</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../screens/perfil-colaborador.html" class="nav-link">
                        <span class="nav-icon"><i class="fas fa-user"></i></span>
                        <span class="nav-text">Meu Perfil</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../screens/comunicados-colaborador.html" class="nav-link">
                        <span class="nav-icon"><i class="fas fa-envelope"></i></span>
                        <span class="nav-text">Comunicados</span>
                    </a>
                </li>
                <li class="nav-item hidden" id="nav-item-equipe">
                    <a href="../screens/equipe-colaborador.html" class="nav-link">
                        <span class="nav-icon"><i class="fas fa-people-group"></i></span>
                        <span class="nav-text">Minha Equipe</span>
                    </a>
                </li>
            </ul>
        </nav>
        <div class="sidebar-footer">
            <div class="user-card" id="sidebar-user-card">
                <div class="user-avatar" id="sidebar-avatar">?</div>
                <div class="user-info">
                    <p class="user-name" id="sidebar-name">—</p>
                    <p class="user-role" id="sidebar-role">Colaborador</p>
                </div>
                <button class="sidebar-logout-btn" onclick="logout()" title="Sair">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="main-wrapper">
        <header class="topbar">
            <div class="topbar-left">
                <button class="topbar-menu-btn" id="topbar-menu-btn" aria-label="Abrir menu">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <div class="topbar-right">
                <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" aria-label="Alternar tema escuro">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="topbar-date" id="topbar-date" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false">
                    <i class="fas fa-calendar-day"></i>
                    <span id="topbar-date-text">—</span>
                </div>
                <div class="calendar-popover" id="calendar-popover">
                    <div class="calendar-header">
                        <button type="button" class="calendar-nav-btn" id="calendar-prev" aria-label="Mês anterior">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <span class="calendar-title" id="calendar-title">—</span>
                        <button type="button" class="calendar-nav-btn" id="calendar-next" aria-label="Próximo mês">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                    <div class="calendar-weekdays">
                        <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
                    </div>
                    <div class="calendar-grid" id="calendar-grid"></div>
                </div>
            </div>
        </header>

        <main class="content">
            <div class="page-body">
                <div class="welcome-banner">
                    <div class="welcome-deco welcome-deco--1"></div>
                    <div class="welcome-deco welcome-deco--2"></div>
                    <div class="welcome-deco welcome-deco--3"></div>
                    <div class="welcome-left">
                        <div class="welcome-avatar" id="welcome-avatar">?</div>
                        <div class="welcome-text">
                            <p class="welcome-greeting" id="welcome-greeting">Olá!</p>
                            <p class="welcome-name" id="welcome-name">Colaborador</p>
                            <p class="welcome-meta" id="welcome-meta">—</p>
                        </div>
                    </div>
                    <div class="welcome-badge" id="welcome-badge">
                        <i class="fas fa-circle"></i>
                        <span id="welcome-status">Ativo</span>
                    </div>
                </div>

                <div class="info-grid">
                    <div class="info-card info-card--blue">
                        <div class="info-card-icon info-icon--blue"><i class="fas fa-briefcase"></i></div>
                        <div class="info-card-body">
                            <span class="info-card-label">Cargo</span>
                            <span class="info-card-value" id="info-role">—</span>
                        </div>
                    </div>
                    <div class="info-card info-card--purple">
                        <div class="info-card-icon info-icon--purple"><i class="fas fa-building"></i></div>
                        <div class="info-card-body">
                            <span class="info-card-label">Departamento</span>
                            <span class="info-card-value" id="info-dept">—</span>
                        </div>
                    </div>
                    <div class="info-card info-card--green">
                        <div class="info-card-icon info-icon--green"><i class="fas fa-calendar-check"></i></div>
                        <div class="info-card-body">
                            <span class="info-card-label">Data de Admissão</span>
                            <span class="info-card-value" id="info-admission">—</span>
                        </div>
                    </div>
                    <div class="info-card info-card--orange">
                        <div class="info-card-icon info-icon--orange"><i class="fas fa-envelope"></i></div>
                        <div class="info-card-body">
                            <span class="info-card-label">E-mail</span>
                            <span class="info-card-value" id="info-email">—</span>
                        </div>
                    </div>
                </div>

                <div class="onboarding-card hidden" id="onboarding-card">
                    <div class="onboarding-card-header">
                        <div>
                            <h2 class="section-title"><span class="section-title-accent"></span>Jornada de Integração</h2>
                            <p class="onboarding-sub">Seus primeiros 90 dias na Nexus</p>
                        </div>
                        <div class="onboarding-progress-wrap">
                            <div class="onboarding-progress-bar"><div class="onboarding-progress-fill" id="onboarding-progress-fill"></div></div>
                            <span class="onboarding-progress-label" id="onboarding-progress-label">0/0</span>
                        </div>
                    </div>
                    <div class="onboarding-stages" id="onboarding-stages"></div>
                </div>

                <div class="section-title-row">
                    <h2 class="section-title">
                        <span class="section-title-accent"></span>
                        Acesso Rápido
                    </h2>
                </div>

                <div class="quick-actions">
                    <button class="quick-card quick-card--blue" onclick="window.location.href='../screens/holerite-colaborador.html'">
                        <i class="fas fa-file-invoice-dollar quick-card-icon"></i>
                        <div class="quick-card-content">
                            <span class="quick-label">Ver Holerite</span>
                            <span class="quick-desc">Mês atual</span>
                        </div>
                        <i class="fas fa-arrow-right quick-card-arrow"></i>
                    </button>
                    <button class="quick-card quick-card--green" onclick="window.location.href='../screens/ferias-colaborador.html'">
                        <i class="fas fa-umbrella-beach quick-card-icon"></i>
                        <div class="quick-card-content">
                            <span class="quick-label">Solicitar Férias</span>
                            <span class="quick-desc">Agendar período</span>
                        </div>
                        <i class="fas fa-arrow-right quick-card-arrow"></i>
                    </button>
                    <button class="quick-card quick-card--purple" onclick="window.location.href='../screens/documentos-colaborador.html'">
                        <i class="fas fa-folder-open quick-card-icon"></i>
                        <div class="quick-card-content">
                            <span class="quick-label">Documentos</span>
                            <span class="quick-desc">Meus arquivos</span>
                        </div>
                        <i class="fas fa-arrow-right quick-card-arrow"></i>
                    </button>
                    <button class="quick-card quick-card--orange" onclick="window.location.href='../screens/ponto-colaborador.html'">
                        <i class="fas fa-clock quick-card-icon"></i>
                        <div class="quick-card-content">
                            <span class="quick-label">Banco de Horas</span>
                            <span class="quick-desc">Registrar ponto</span>
                        </div>
                        <i class="fas fa-arrow-right quick-card-arrow"></i>
                    </button>
                    <button class="quick-card quick-card--blue hidden" id="quick-card-equipe" onclick="window.location.href='../screens/equipe-colaborador.html'">
                        <i class="fas fa-people-group quick-card-icon"></i>
                        <div class="quick-card-content">
                            <span class="quick-label">Minha Equipe</span>
                            <span class="quick-desc" id="quick-equipe-desc">Aprovar férias</span>
                        </div>
                        <i class="fas fa-arrow-right quick-card-arrow"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../javascript/shared/supabase-client.js"></script>
<script src="../javascript/shared/auth.js"></script>
<script src="../javascript/inicio-colaborador.js"></script>
</body>
</html>
