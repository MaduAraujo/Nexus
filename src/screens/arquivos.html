<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus — Arquivos</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../styles/arquivos.css">
    <style>
        .main-wrapper { margin-left: 0 !important; width: 100% !important; }
        .btn-back { display: inline-flex; align-items: center; gap: 8px; color: #9ca3af; text-decoration: none; font-size: 0.85rem; font-weight: 600; padding: 6px 10px; border-radius: 8px; transition: color 0.2s, background 0.2s; }
        .btn-back:hover { color: #fff; background: rgba(255,255,255,0.08); }
        .btn-back i { font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="layout">
        <div class="main-wrapper" style="margin-left:0;width:100%">
            <header class="topbar">
                <div class="topbar-left">
                    <a href="../screens/inicio-rh.html" class="btn-back">
                        <i class="fas fa-arrow-left"></i>
                        <span>Voltar</span>
                    </a>
                </div>
                <div class="header-actions">
                    <button class="btn-upload" id="btn-upload" onclick="openUploadModal()">
                        <i class="fas fa-arrow-up-from-bracket"></i>
                        <span>Enviar Arquivo</span>
                    </button>
                </div>
            </header>

            <button class="btn-fab" id="btn-fab" onclick="openUploadModal()" aria-label="Enviar Arquivo">
                <i class="fas fa-arrow-up-from-bracket"></i>
            </button>

            <main class="content">
                <div class="page-body">
                    <div class="stats-row">
                        <div class="stat-card stat-card--total">
                            <div class="stat-icon-wrap">
                                <i class="fas fa-folder-open"></i>
                            </div>
                            <div class="stat-body">
                                <span class="stat-value" id="total-count">0</span>
                                <span class="stat-label">Total de Arquivos</span>
                            </div>
                        </div>
                        <div class="stat-card stat-card--admissional">
                            <div class="stat-icon-wrap">
                                <i class="fas fa-user-plus"></i>
                            </div>
                            <div class="stat-body">
                                <span class="stat-value" id="admissional-count">0</span>
                                <span class="stat-label">Admissionais</span>
                            </div>
                        </div>
                        <div class="stat-card stat-card--demissional">
                            <div class="stat-icon-wrap">
                                <i class="fas fa-user-minus"></i>
                            </div>
                            <div class="stat-body">
                                <span class="stat-value" id="demissional-count">0</span>
                                <span class="stat-label">Demissionais</span>
                            </div>
                        </div>
                    </div>

                    <div class="content-card">
                        <div class="content-card-toolbar">
                            <div class="tabs-nav">
                                <button class="tab-btn active" data-tab="admissional">
                                    <i class="fas fa-user-plus"></i>
                                    <span>Admissional</span>
                                </button>
                                <button class="tab-btn" data-tab="demissional">
                                    <i class="fas fa-user-minus"></i>
                                    <span>Demissional</span>
                                </button>
                                <button class="tab-btn" data-tab="colaborador">
                                    <i class="fas fa-users"></i>
                                    <span>Colaboradores</span>
                                </button>
                            </div>
                            <div class="search-wrapper">
                                <i class="fas fa-magnifying-glass search-icon"></i>
                                <input type="text" id="search-input" placeholder="Buscar arquivo ou colaborador…">
                                <button class="search-clear hidden" id="search-clear">
                                    <i class="fas fa-xmark"></i>
                                </button>
                            </div>
                        </div>

                        <div class="table-container">
                            <table class="files-table">
                                <thead>
                                    <tr>
                                        <th>Arquivo</th>
                                        <th>Colaborador</th>
                                        <th>Tipo</th>
                                        <th>Data</th>
                                        <th>Tamanho</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="files-tbody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal-overlay" id="upload-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-header-icon">
                    <i class="fas fa-cloud-arrow-up"></i>
                </div>
                <div>
                    <h3 class="modal-title">Enviar Arquivo</h3>
                    <p class="modal-subtitle">Adicione um documento ao acervo do RH</p>
                </div>
                <button class="close-modal" onclick="closeUploadModal()" aria-label="Fechar">
                    <i class="fas fa-xmark"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Colaborador <span class="label-optional">opcional</span></label>
                    <select id="upload-employee-select">
                        <option value="">Selecione o colaborador...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Categoria</label>
                    <select id="upload-category">
                        <option value="" disabled selected>Selecione a categoria...</option>
                        <optgroup label="Admissional">
                            <option value="admissional|RG">RG</option>
                            <option value="admissional|CPF">CPF</option>
                            <option value="admissional|Comprovante de Residência">Comprovante de Residência</option>
                            <option value="admissional|Exame Admissional">Exame Admissional</option>
                            <option value="admissional|Carteira de Trabalho">Carteira de Trabalho</option>
                            <option value="admissional|Contrato de Trabalho">Contrato de Trabalho</option>
                            <option value="admissional|Outros">Outros (Admissional)</option>
                        </optgroup>
                        <optgroup label="Demissional">
                            <option value="demissional|Aviso Prévio">Aviso Prévio</option>
                            <option value="demissional|Termo de Rescisão">Termo de Rescisão</option>
                            <option value="demissional|Exame Demissional">Exame Demissional</option>
                            <option value="admissional|Carteira de Trabalho">Carteira de Trabalho</option>
                            <option value="demissional|Homologação">Homologação</option>
                            <option value="demissional|Guia FGTS">Guia FGTS</option>
                            <option value="demissional|Outros">Outros (Demissional)</option>
                        </optgroup>
                    </select>
                </div>
                <div class="form-group">
                    <label>Arquivo</label>
                    <div class="drop-zone" id="drop-zone">
                        <div class="drop-zone-inner">
                            <div class="drop-zone-icon">
                                <i class="fas fa-cloud-arrow-up"></i>
                            </div>
                            <p class="drop-zone-title">Arraste ou <span>escolha o arquivo</span></p>
                            <p class="drop-zone-hint">PDF, DOCX ou JPG · até 50 MB</p>
                        </div>
                        <input type="file" id="file-input" accept=".pdf,.docx,.jpg" hidden>
                    </div>
                    <div class="file-selected hidden" id="file-selected">
                        <div class="file-selected-icon"><i class="fas fa-file-circle-check"></i></div>
                        <span id="file-selected-name"></span>
                        <button onclick="clearFileInput()" aria-label="Remover arquivo"><i
                                class="fas fa-xmark"></i></button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeUploadModal()">Cancelar</button>
                <button class="btn-submit" onclick="submitUpload()">
                    <i class="fas fa-upload"></i> Enviar
                </button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../javascript/supabase-client.js"></script>
    <script src="../javascript/arquivos.js"></script>
</body>
</html>
